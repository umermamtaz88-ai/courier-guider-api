[project]
name = "logistics-ai-backend"
version = "0.1.0"
description = "B2B AI Logistics & Customs Agent backend"
readme = "README.md"
authors = [
    { name = "umermamtaz88-ai", email = "umermamtaz88@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.141.1",
    "uvicorn[standard]>=0.52.4",
    "pydantic[email]>=2.0",
    "pydantic-settings>=2.0",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "pgvector>=0.3",
    "httpx>=0.28",
    "python-multipart>=0.0.20",
    "pwdlib[argon2]>=0.2",
    "pyjwt>=2.10",
    "cryptography>=44.0",
    "tenacity>=9.0",
    "structlog>=25.0",
    "pypdf>=5.0",
]

[dependency-groups]
dev = [
    "pgembed>=0.2.0",
    "pytest>=8.0",
    "pytest-asyncio>=0.25",
]

[project.scripts]
logistics-ai = "app.main:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
